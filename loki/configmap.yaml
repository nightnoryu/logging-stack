apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-config
data:
  config.yaml: |
    auth_enabled: false

    server:
      http_listen_port: 3100
      grpc_listen_port: 9096

    common:
      path_prefix: /loki
      replication_factor: 1
      ring:
        kvstore:
          store: inmemory
          
    limits_config:
      retention_period: 14d
    
      ingestion_rate_mb: 8
      ingestion_burst_size_mb: 16
    
      max_query_parallelism: 16
