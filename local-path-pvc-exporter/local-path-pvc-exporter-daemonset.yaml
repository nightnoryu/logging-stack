apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: local-path-pvc-exporter
  labels:
    app: local-path-pvc-exporter
spec:
  selector:
    matchLabels:
      app: local-path-pvc-exporter
  template:
    metadata:
      labels:
        app: local-path-pvc-exporter
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9108"
    spec:
      automountServiceAccountToken: false
      containers:
        - name: exporter
          image: python:3.13-alpine
          command:
            - python
            - -B
            - /app/exporter.py
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          ports:
            - name: metrics
              containerPort: 9108
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              add:
                # Needed to traverse owner-only directories inside PVCs.
                - DAC_OVERRIDE
            readOnlyRootFilesystem: true
            runAsUser: 0
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: metrics
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
          volumeMounts:
            - name: script
              mountPath: /app
              readOnly: true
            - name: storage
              mountPath: /host-storage
              readOnly: true
      volumes:
        - name: script
          configMap:
            name: local-path-pvc-exporter
        - name: storage
          hostPath:
            path: /var/lib/rancher/k3s/storage
            type: Directory
